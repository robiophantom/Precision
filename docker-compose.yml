version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: precision
    ports:
      - "5433:5432"
    volumes:
      - precision_postgres_data:/var/lib/postgresql/data

volumes:
  precision_postgres_data:
